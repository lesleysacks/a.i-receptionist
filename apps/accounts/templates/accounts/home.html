<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apex</title>
</head>
<body>
  <h1>Apex</h1>
  <p>Signed in as {{ user.email }}</p>
  {% if is_platform_admin %}<p>Platform administrator</p>{% endif %}
  <h2>Memberships</h2>
  <ul>
    {% for membership in memberships %}
      <li>{{ membership.tenant.name }} — {{ membership.role }}</li>
    {% empty %}
      <li>No tenant memberships.</li>
    {% endfor %}
  </ul>
  <form method="post" action="{% url 'accounts-logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
</body>
</html>

{% extends "base.html" %}
{% block title %}{{ 'Edit' if service else 'New' }} Service{% endblock %}
{% block body %}
<h1>{{ 'Edit' if service else 'New' }} Service</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="name">Name</label>
  <input id="name" type="text" name="name" value="{{ form.name if form else (service.name if service else '') }}" required>
  <label for="price">Price</label>
  <input id="price" type="number" step="0.01" min="0" name="price"
         value="{{ form.price if form else (service.price if service and service.price is not none else '') }}">
  <label for="duration_minutes">Duration (minutes)</label>
  <input id="duration_minutes" type="number" min="1" name="duration_minutes"
         value="{{ form.duration_minutes if form else (service.duration_minutes if service and service.duration_minutes is not none else '') }}">
  <label><input type="checkbox" name="active" {{ 'checked' if (form.active if form else (service.active if service else True)) else '' }}> Active</label>
  <button type="submit">Save</button>
  <a href="{{ url_for('dashboard.services') }}">Cancel</a>
</form>
{% endblock %}

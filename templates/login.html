<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login &middot; AI Receptionist</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 360px; color: #1a1a1a; }
    label { display: block; margin: 0.8rem 0 0.2rem; }
    input { padding: 8px; width: 100%; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 8px 14px; cursor: pointer; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Admin Login</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
